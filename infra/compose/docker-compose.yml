services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - don_juan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    command: node packages/database/dist/cli.js
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    command: node apps/api/dist/main.js
    ports:
      - "${HOST_API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      WORKER_ID: compose-worker
      PRINT_SINK_DIRECTORY: /runtime/prints
    command: node apps/worker/dist/main.js
    volumes:
      - don_juan_prints:/runtime/prints
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    command: node apps/web/node_modules/vite/bin/vite.js apps/web --host 0.0.0.0
    ports:
      - "${HOST_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
volumes:
  don_juan_postgres:
  don_juan_prints:
